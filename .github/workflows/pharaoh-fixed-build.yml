name: Pharaoh Fixed Android Build
on:
  push:
    branches: [pharaoh-build-fix]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Pharaoh project
        shell: bash
        run: |
          mkdir -p pharaohbuild
          printf '%s' '' | base64 -d | tar -xz -C pharaohbuild
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build standard Android app
        working-directory: pharaohbuild
        run: gradle :app:assembleDebug --stacktrace
      - name: Package artifact
        run: cp pharaohbuild/app/build/outputs/apk/debug/app-debug.apk pharaoh.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pharaoh-fixed-apk
          path: pharaoh.apk
          if-no-files-found: error
